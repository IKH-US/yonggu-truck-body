<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#102b29">
  <title>找不到頁面｜永固車廂廠</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <style>
    :root{--ink:#102b29;--lime:#c2ff4c}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--ink);color:#fff;font:400 16px/1.8 'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC','Noto Sans CJK TC','Microsoft YaHei','PingFang SC',sans-serif;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
    main{max-width:520px}
    .brand{display:inline-flex;align-items:center;gap:12px;font-weight:700;font-size:18px;text-decoration:none;color:inherit;margin-bottom:56px}
    .brand i{display:grid;place-items:center;width:34px;height:34px;border:1px solid currentColor;font-style:normal;font-size:21px;font-weight:600}
    .code{font:400 14px ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;letter-spacing:.2em;color:#ffffff99;margin:0 0 14px}
    h1{font-size:clamp(34px,7vw,52px);font-weight:500;line-height:1.3;letter-spacing:-.02em;margin:0 0 16px}
    p{color:#ffffffc4;margin:0 0 32px}
    .btn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;text-decoration:none;padding:15px 26px;border-radius:8px}
    .btn:hover,.btn:focus-visible{background:#fff}
    .btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/"><i aria-hidden="true">永</i>永固車廂廠</a>
    <p class="code">404</p>
    <h1>找不到這個頁面。</h1>
    <p>網址可能已更改，或輸入有誤。你可以返回首頁，查看車廂配置或聯絡我們。</p>
    <a class="btn" href="/">返回首頁</a>
  </main>
</body>
</html>
